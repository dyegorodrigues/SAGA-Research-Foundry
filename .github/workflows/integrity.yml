name: Foundry Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-originals:
    name: Verify external originals
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Base64 parts, reconstructed ZIP and expected members
        run: python3 tools/verify_originals_integrity.py
